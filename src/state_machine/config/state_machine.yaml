state_machine_node:
  ros__parameters:
    state_topic: "/state"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_waypoints/path"

    frenet_odom_topic: "/car_state/frenet/odom"
    global_waypoints_topic: "/global_waypoints"
    avoid_waypoints_topic: "/avoid_waypoints"
    opponent_topic: "/opp_obs"

    frame_id: "map"
    default_state: "global"

    # /state의 FSM 평가/heartbeat 주기입니다. local waypoint는 Frenet odom 이벤트로 발행합니다.
    publish_rate_hz: 10.0
    waypoint_num: 50

    # AVOID는 모든 상태에서 최우선입니다. CRUISE는 /opp_obs의 is_interfering=true로 진입합니다.
    allow_avoid_transition: true
    allow_cruise_transition: true
    local_path_confirmation_window_size: 5
    local_path_confirmation_min_hits: 3

    # GLOBAL은 검증 후 정적 경로로 계속 사용하며, 발행자 침묵은 경고만 냅니다.
    global_publisher_warn_timeout_sec: 5.0
    # 모든 local waypoint 출력에 공통 적용하는 Frenet freshness 게이트입니다.
    frenet_stale_timeout_sec: 0.5
    # 마지막 /opp_obs가 이 시간보다 오래되면 간섭 없음으로 보고 CRUISE에서 GLOBAL로 복귀합니다.
    opponent_stale_timeout_sec: 0.3
    invalid_local_path_policy: "global_fallback"

    # AVOID -> GLOBAL 복귀 계약 (2026-08-16 개정).
    # 장애물 제거 판정의 단일 소유자는 플래너입니다. 플래너가 남은 blocking cluster가
    # 없음을 확인한 뒤 발행하는 ot_line 표식이 있어야만 아래 거리·횡오차·지속시간 검사를
    # 평가합니다. FSM이 /static_obs와 ego 횡위치로 같은 것을 중복 판정하던
    # has_front_static_obstacle / stopped_path_clear 계열은 제거했습니다(ego가 회피
    # 오프셋에 있으면 라인 위 장애물과 겹치지 않아 오판, 플래너와 다른 토픽 사용).
    handoff_ot_line: "raceline_global_handoff"
    enter_global_sec: 0.5
    enter_global_threshold: 0.2
    # 경로 끝에서 거꾸로 잰 tail 창의 **호 길이**[m]. local_planning의
    # state_handoff_tail_distance_m와 반드시 같은 값이어야 합니다 — 플래너는 핸드오프
    # 루프를 회전해 ego를 정확히 이 tail 구간의 첫 점에 놓습니다. 값이 어긋나면 tail이
    # ego에서 (플래너값-FSM값)만큼 떨어진 곳에서 시작해 게이트가 성립하지 않습니다
    # (2026-08-16 11:26/11:28 백: 플래너 6.0 / FSM 1.0 불일치로 8랩 전이 0회 실측).
    # 6.0인 이유: 핸드오프 루프는 완료 시점에 고정되고 ego는 계속 전진하므로 이 창은
    # "앵커에서 몇 m 안에 복귀를 확정해야 하는가"다. 완료 시점 ego는 아직 회피 오프셋
    # (|d| 0.33~0.71)에 있고 컨트롤러 자연 수렴이 0.055 m/m라 |d|<=0.2까지 4~9 m가
    # 필요하다. 표식 게이트가 전제이므로 창을 넓혀도 조기 복귀 위험은 없다.
    enter_global_tail_distance_m: 6.0
    enter_global_s_gap_tol_m: 0.5

    # 마지막 보루 liveness 탈출: non-empty 회피 발행이 이 시간 동안 끊기면(빈 경로만
    # 오는 경우 포함) 장애물 여부와 무관하게 GLOBAL로 복귀합니다. 죽은 플래너가 FSM을
    # 영원히 AVOID에 고정하는 것만 막는 장치이며, 플래너가 정지 경로라도 계속 발행하는
    # 한 발동하지 않습니다(장애물 앞 정지는 올바른 상태).
    avoid_path_liveness_timeout_sec: 2.0
